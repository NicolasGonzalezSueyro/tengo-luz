<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#006d59">
  <title>Página no encontrada · ¿Tengo luz?</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💡</text></svg>">
  <!-- Cloudflare Pages muestra esta página (con código 404) para cualquier dirección que no existe. -->
  <style>
    :root { color-scheme: light dark; --fondo: #f4f7f6; --texto: #12302a; --suave: #4b635d; --acento: #006d59; }
    @media (prefers-color-scheme: dark) { :root { --fondo: #0d1715; --texto: #e6f2ef; --suave: #9db3ac; --acento: #3fc7b0; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
      background: var(--fondo); color: var(--texto); font: 16px/1.5 system-ui, sans-serif; text-align: center; }
    h1 { font-size: 1.5rem; margin: 0 0 8px; }
    p { color: var(--suave); margin: 0 0 20px; }
    a { display: inline-block; padding: 10px 18px; border-radius: 999px; background: var(--acento); color: #fff; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>💡 Esta página no existe</h1>
    <p>Puede que el link esté mal copiado o que la página se haya movido.</p>
    <a href="/">Ir al mapa de cortes</a>
  </main>
</body>
</html>
