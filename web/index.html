<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>¿Tengo luz? · Cortes programados en Córdoba</title>
  <meta name="description" content="Mapa de los cortes de luz programados por barrio en Córdoba capital y Gran Córdoba. Sitio no oficial.">
  <!-- Cómo se ve el link cuando se comparte por WhatsApp, Telegram, redes, etc. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="¿Tengo luz?">
  <meta property="og:locale" content="es_AR">
  <meta property="og:title" content="¿Tengo luz? · Cortes de luz programados en Córdoba">
  <meta property="og:description" content="Mirá en el mapa si tu barrio tiene un corte de luz programado, avisá si te quedaste sin luz y recibí avisos por Telegram. Sitio no oficial.">
  <meta property="og:image" content="https://tengo-luz.pages.dev/vista-previa.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#6d28d9">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icono-192.png">
  <meta name="apple-mobile-web-app-title" content="¿Tengo luz?">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💡</text></svg>">
  <script src="tema.js"></script>
  <link rel="preload" href="fuentes/outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header class="cabecera">
    <button id="abrir-menu" class="boton-icono" type="button" aria-label="Abrir menú" aria-haspopup="dialog">
      <span data-icono="menu"></span>
    </button>
    <a class="marca" href="./">
      <strong>¿Tengo luz?</strong>
      <small>Cortes programados · Córdoba y alrededores</small>
    </a>
    <button id="tema" class="boton-icono" type="button" aria-label="Cambiar tema"></button>
  </header>

  <!-- Menú lateral. <dialog> ya trae lo necesario: se cierra con Escape y mantiene el foco adentro. -->
  <dialog id="menu" class="menu" aria-label="Menú">
    <div class="menu-cabecera">
      <span class="logo"><span data-icono="bombita"></span></span>
      <strong>¿Tengo luz?</strong>
      <button id="cerrar-menu" class="boton-icono" type="button" aria-label="Cerrar menú"><span data-icono="cerrar"></span></button>
    </div>
    <nav class="menu-opciones">
      <button type="button" data-accion="inicio"><span data-icono="lista"></span>Todos los cortes</button>
      <button type="button" data-accion="reportar"><span data-icono="rayo"></span>Reportar que no tengo luz</button>
      <button type="button" data-accion="como-funciona"><span data-icono="ayuda"></span>¿Cómo funciona?</button>
      <button id="instalar" type="button" data-accion="instalar" hidden><span data-icono="descargar"></span>Instalar la app</button>
      <button type="button" data-accion="tema"><span data-icono="luna"></span><span id="texto-tema">Modo oscuro</span></button>
      <hr>
      <button type="button" data-accion="reclamar"><span data-icono="mensaje"></span>Reclamar a EPEC</button>
      <a href="tel:08007770000"><span data-icono="telefono"></span>Llamar al 0800 777 0000</a>
      <a href="https://github.com/NicolasGonzalezSueyro/tengo-luz" target="_blank" rel="noopener"><span data-icono="github"></span>Código en GitHub</a>
    </nav>
    <p class="menu-pie">Sitio no oficial, sin relación con EPEC.</p>
  </dialog>

  <nav class="barra" aria-label="Filtros">
    <div id="dias" class="chips" role="group" aria-label="Elegí el día"></div>
    <div class="acciones">
      <form id="form-buscar" class="buscador" role="search">
        <span data-icono="buscar"></span>
        <input id="buscar" placeholder="Buscá tu barrio" aria-label="Buscar barrio">
      </form>
      <button id="ubicacion" class="boton boton-primario" type="button" aria-label="Usar mi ubicación">
        <span data-icono="ubicacion"></span><span>Mi ubicación</span>
      </button>
    </div>
  </nav>

  <main class="contenido">
    <div id="mapa" role="region" aria-label="Mapa de barrios de Córdoba"></div>
    <div id="aviso-flotante" class="aviso-flotante" role="status" aria-live="polite"></div>
    <div id="sin-conexion" class="sin-conexion" role="status" hidden>Sin conexión: estás viendo los últimos datos guardados</div>
    <aside id="panel" class="panel">
      <button id="asa" class="asa" type="button" aria-label="Mostrar u ocultar la lista de cortes" aria-expanded="false">
        <span></span>
      </button>
      <div id="panel-contenido" class="panel-contenido" aria-live="polite">
        <p class="cargando">Cargando cortes…</p>
      </div>
    </aside>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="app.js"></script>
</body>
</html>
