# Cada media hora, una máquina Ubuntu de GitHub lee las notas nuevas de El Doce y actualiza data/mantenimientos.json.
# Si cambió algo, lo guarda con un commit; ese commit hace que Cloudflare vuelva a publicar la página.
# Así el sitio se mantiene al día sin que haya ninguna compu prendida.
name: Actualizar cortes

on:
  schedule:
    # Cada 30 minutos (17 y 47 de cada hora). GitHub atrasa o saltea corridas programadas cuando está cargado,
    # así que pedirlo seguido asegura que igual corra varias veces por día. Evitamos el minuto 0, el más cargado.
    - cron: '17,47 * * * *'
  workflow_dispatch: # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write # para poder hacer el commit con los datos nuevos

concurrency:
  group: actualizar-cortes # nunca dos actualizaciones a la vez
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # la primera búsqueda de calles de varios cortes nuevos puede tardar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test # si los tests fallan, no tocamos los datos
      - name: Leer los cortes
        env:
          SECRETO_BOT: ${{ secrets.SECRETO_BOT }} # para avisarte por Telegram si algo hay que revisar a mano
          EPEC_OFICIAL_KEY: ${{ secrets.EPEC_OFICIAL_KEY }} # para leer los cortes de EPEC (sin ella, usa El Doce)
        run: npm run lector
      - name: Guardar los datos si cambiaron
        run: |
          if git diff --quiet -- data/; then
            echo "Sin cambios en los cortes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Datos: actualización automática de cortes"
          git push
      # Le pasa los cortes al bot de Telegram para que avise a quienes siguen esos barrios.
      # Corre siempre (haya cambios o no): nunca repite un aviso, y así manda los que hayan quedado pendientes.
      - name: Avisar por Telegram
        env:
          SECRETO_BOT: ${{ secrets.SECRETO_BOT }}
        run: npm run avisar
      # Las fallas que EPEC describe por calles se achican al sector exacto (sin el secreto FALLAS_CLAVE, no hace nada).
      - name: Achicar las fallas al sector
        env:
          FALLAS_CLAVE: ${{ secrets.FALLAS_CLAVE }}
        run: npm run sectores-fallas
      # Si cualquier paso de arriba falló, te llega un mensaje del bot (como mucho uno por día) con el link al detalle.
      - name: Avisarte si algo falló
        if: failure()
        env:
          SECRETO_BOT: ${{ secrets.SECRETO_BOT }}
        run: node src/alertar.ts "❌ Falló la actualización automática de cortes." "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
