# Cada vez que se sube código, GitHub corre los tests y el chequeo de tipos en una máquina Ubuntu.
# Si algo falla, el commit aparece con una ❌ en GitHub y te llega un mail.
name: Tests

on:
  push:
  pull_request:

# Los tests solo necesitan leer el código: si una herramienta de terceros fuera maliciosa, no podría modificar el repo.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
