# Cada vez que se sube código, GitHub corre los tests y el chequeo de tipos en una máquina Ubuntu.
# Si algo falla, el commit aparece con una ❌ en GitHub y te llega un mail.
name: Tests

on:
  push:
  pull_request:

# Los tests solo necesitan leer el código: si una herramienta de terceros fuera maliciosa, no podría modificar el repo.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Tests de punta a punta: un navegador de verdad (Chromium) recorre la página como una persona,
  # en una compu y en un celular simulados (ver e2e/ y playwright.config.ts).
  punta-a-punta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # Si algo falla, el informe (con capturas y la grabación paso a paso) queda para descargar en la corrida.
      - if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: informe-playwright
          path: playwright-report/
          retention-days: 7
